<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Email - NutriTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{primary:'#007a35',mint:'#e9f8ef',ink:'#071727'}}}}</script>
</head>
<body class="min-h-screen bg-[#f4f7fb] font-sans text-ink flex items-center justify-center px-6">
<main class="max-w-lg w-full bg-white border border-slate-200 rounded-[32px] p-8 text-center shadow-xl">
<a class="inline-flex items-center gap-3 mb-8" href="index.html"><span class="w-11 h-11 rounded-xl bg-primary text-white flex items-center justify-center material-symbols-outlined">nutrition</span><span class="font-black text-2xl text-primary">NutriTrack</span></a>
<div class="mx-auto w-24 h-24 rounded-[28px] bg-mint text-primary flex items-center justify-center mb-7"><span class="material-symbols-outlined text-5xl">outgoing_mail</span></div>
<h1 class="text-3xl font-black mb-3">Cek email kamu</h1>
<p class="text-slate-600 mb-7">Kami sudah mengirim link verifikasi ke <strong>alex@nutritrack.app</strong>. Untuk demo frontend, lanjutkan ke onboarding.</p>
<div class="grid gap-3">
<a class="h-12 rounded-2xl bg-primary text-white font-extrabold flex items-center justify-center" href="onboarding.html">Saya Sudah Verifikasi</a>
<a class="h-12 rounded-2xl bg-slate-100 text-slate-700 font-bold flex items-center justify-center" href="register.html">Salah email? Kembali</a>
</div>
<p class="text-xs text-slate-400 mt-6">Kirim ulang tersedia dalam <span id="countdown">60</span> detik.</p>
</main>
<script>let n=60;setInterval(()=>{n=Math.max(0,n-1);document.getElementById('countdown').textContent=n},1000);</script>
</body>
</html>
