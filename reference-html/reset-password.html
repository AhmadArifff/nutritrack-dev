<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password - NutriTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{primary:'#007a35',mint:'#e9f8ef',ink:'#071727'}}}}</script>
</head>
<body class="min-h-screen bg-[#f4f7fb] font-sans text-ink flex items-center justify-center px-6">
<main class="max-w-md w-full bg-white border border-slate-200 rounded-[32px] p-8 shadow-xl">
<a class="inline-flex items-center gap-3 mb-8" href="index.html"><span class="w-11 h-11 rounded-xl bg-primary text-white flex items-center justify-center material-symbols-outlined">nutrition</span><span class="font-black text-2xl text-primary">NutriTrack</span></a>
<h1 class="text-3xl font-black mb-3">Reset Kata Sandi</h1>
<p class="text-slate-600 mb-7">Buat password baru untuk akun NutriTrack.</p>
<form class="space-y-5" id="resetForm">
<input class="w-full h-12 rounded-2xl border border-slate-200 bg-slate-50 px-4 outline-none focus:ring-4 focus:ring-green-900/10 focus:border-primary" required type="password" placeholder="Password baru" value="nutritrack"/>
<input class="w-full h-12 rounded-2xl border border-slate-200 bg-slate-50 px-4 outline-none focus:ring-4 focus:ring-green-900/10 focus:border-primary" required type="password" placeholder="Konfirmasi password" value="nutritrack"/>
<div class="grid grid-cols-5 gap-2"><span class="h-2 rounded-full bg-primary"></span><span class="h-2 rounded-full bg-primary"></span><span class="h-2 rounded-full bg-primary"></span><span class="h-2 rounded-full bg-primary"></span><span class="h-2 rounded-full bg-slate-200"></span></div>
<button class="w-full h-12 rounded-2xl bg-primary text-white font-extrabold" type="submit">Simpan Password</button>
</form>
</main>
<script>document.getElementById('resetForm').addEventListener('submit',e=>{e.preventDefault();location.href='login.html'});</script>
</body>
</html>
