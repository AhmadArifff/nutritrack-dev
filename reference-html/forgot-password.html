<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - NutriTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{primary:'#007a35',mint:'#e9f8ef',ink:'#071727'}}}}</script>
</head>
<body class="min-h-screen bg-[#f4f7fb] font-sans text-ink flex items-center justify-center px-6">
<main class="max-w-md w-full bg-white border border-slate-200 rounded-[32px] p-8 shadow-xl">
<a class="inline-flex items-center gap-3 mb-8" href="index.html"><span class="w-11 h-11 rounded-xl bg-primary text-white flex items-center justify-center material-symbols-outlined">nutrition</span><span class="font-black text-2xl text-primary">NutriTrack</span></a>
<h1 class="text-3xl font-black mb-3">Lupa Kata Sandi</h1>
<p class="text-slate-600 mb-7">Masukkan email untuk menerima link reset. Demo frontend akan membuka halaman reset langsung.</p>
<form class="space-y-5" id="forgotForm">
<label class="block"><span class="text-sm font-bold text-slate-700">Email</span><input class="mt-2 w-full h-12 rounded-2xl border border-slate-200 bg-slate-50 px-4 outline-none focus:ring-4 focus:ring-green-900/10 focus:border-primary" required type="email" value="alex@nutritrack.app"/></label>
<button class="w-full h-12 rounded-2xl bg-primary text-white font-extrabold" type="submit">Kirim Link Reset</button>
</form>
<a class="mt-5 inline-flex font-bold text-primary" href="login.html">Kembali ke login</a>
</main>
<script>document.getElementById('forgotForm').addEventListener('submit',e=>{e.preventDefault();location.href='reset-password.html'});</script>
</body>
</html>
